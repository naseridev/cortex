name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate version
        id: meta
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: [ci, prepare]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      BIN_NAME: ${{ matrix.bin_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: cortex
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: cortex
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: cortex
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: cortex.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config xorg-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target "$TARGET"

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          stage="cortex-v${VERSION}-${TARGET}"
          mkdir -p "$stage"
          cp "target/${TARGET}/release/${BIN_NAME}" README.md README.wiki.md "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"
          shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "cortex-v$($env:VERSION)-$($env:TARGET)"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$($env:TARGET)/release/$($env:BIN_NAME)", "README.md", "README.wiki.md" -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "${stage}.zip"
          $hash = (Get-FileHash "${stage}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${stage}.zip" | Out-File -FilePath "${stage}.zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: |
            cortex-v*.tar.gz
            cortex-v*.tar.gz.sha256
            cortex-v*.zip
            cortex-v*.zip.sha256

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums and release notes
        shell: bash
        run: |
          cat artifacts/*.sha256 > artifacts/SHA256SUMS.txt
          cat > "${RUNNER_TEMP}/release_notes.md" <<EOF
          ## Cortex v${VERSION}

          ### Highlights in v${VERSION}
          - **Modular Architecture**: Refactored into dedicated \`security\`, \`storage\`, \`domain\`, and \`system\` modules.
          - **Cryptography & Integrity**: Argon2id (64 MiB, 3 iterations), ChaCha20-Poly1305 AEAD, and keyed BLAKE3 database manifests.
          - **Multi-Account Storage**: Isolated \`redb\` vaults with BLAKE3-hashed filenames and OS keyring session caching.
          - **Multi-Cloud Sync**: Deterministic two-way synchronization with tombstone tracking across 15 storage providers.

          ### Pre-compiled Binaries
          | Platform | Architecture | Archive |
          | --- | --- | --- |
          | Linux | x86_64 | \`cortex-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz\` |
          | macOS (Apple Silicon) | ARM64 | \`cortex-v${VERSION}-aarch64-apple-darwin.tar.gz\` |
          | macOS (Intel) | x86_64 | \`cortex-v${VERSION}-x86_64-apple-darwin.tar.gz\` |
          | Windows | x86_64 | \`cortex-v${VERSION}-x86_64-pc-windows-msvc.zip\` |

          ### SHA-256 Checksums
          \`\`\`text
          $(cat artifacts/SHA256SUMS.txt)
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Cortex v${{ needs.prepare.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release_notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt