name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: cortex
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_name: cortex
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            bin_name: cortex
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: cortex.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config xorg-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Extract version from Cargo.toml
        id: meta
        shell: bash
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          STAGE="cortex-v${{ steps.meta.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$STAGE/"
          cp README.md README.wiki.md "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Stage = "cortex-v${{ steps.meta.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -Destination "$Stage/"
          Copy-Item "README.md", "README.wiki.md" -Destination "$Stage/"
          Compress-Archive -Path "$Stage" -DestinationPath "${Stage}.zip"
          $Hash = (Get-FileHash "${Stage}.zip" -Algorithm SHA256).Hash.ToLower()
          "$Hash  ${Stage}.zip" | Out-File -Encoding ascii "${Stage}.zip.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            cortex-v*.tar.gz
            cortex-v*.zip
            cortex-v*.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined checksums and release notes
        id: notes
        shell: bash
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt

          cat <<EOF > release_notes.md
          ## Cortex v${VERSION}

          A secure, multi-account password manager using Argon2id key derivation, ChaCha20-Poly1305 authenticated encryption, BLAKE3 tamper detection, and OpenDAL multi-cloud synchronization.

          ### Highlights in v${VERSION}
          - **Modular Architecture**: Refactored into dedicated \`security\`, \`storage\`, \`domain\`, and \`system\` modules.
          - **Cryptography & Integrity**: Argon2id (64 MiB, 3 iterations), ChaCha20-Poly1305 AEAD, and keyed BLAKE3 database manifests.
          - **Multi-Account Storage**: Isolated \`redb\` vaults with BLAKE3-hashed filenames and OS keyring session caching.
          - **Multi-Cloud Sync**: Deterministic two-way synchronization with tombstone tracking across 15 storage providers.

          ### Pre-compiled Binaries
          | Platform | Architecture | Archive |
          | --- | --- | --- |
          | Linux | x86_64 | \`cortex-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz\` |
          | macOS (Apple Silicon) | ARM64 | \`cortex-v${VERSION}-aarch64-apple-darwin.tar.gz\` |
          | macOS (Intel) | x86_64 | \`cortex-v${VERSION}-x86_64-apple-darwin.tar.gz\` |
          | Windows | x86_64 | \`cortex-v${VERSION}-x86_64-pc-windows-msvc.zip\` |

          ### SHA-256 Checksums
          \`\`\`text
          $(cat SHA256SUMS.txt)
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Cortex v${{ steps.notes.outputs.version }}
          body_path: artifacts/release_notes.md
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt