[package]
name = "cortex"
version = "4.0.0"
edition = "2024"
rust-version = "1.90"
authors = ["Nima Naseri <nerdnull@proton.me>"]
description = "A secure password manager with Argon2id key derivation and authenticated encryption"
publish = false

[dependencies]
argon2 = "0.6"
arboard = "3.7"
blake3 = "1.8"
chacha20poly1305 = "0.11"
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
getrandom = "0.4"
opendal = { version = "0.52", features = [
    "services-azblob",
    "services-b2",
    "services-cos",
    "services-dropbox",
    "services-fs",
    "services-gcs",
    "services-gdrive",
    "services-koofr",
    "services-onedrive",
    "services-oss",
    "services-pcloud",
    "services-s3",
    "services-webdav",
    "services-yandex-disk",
] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rand = "0.10"
redb = "4.4"
regex = "1.13"
rpassword = "7.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
tempfile = "3.27"
tokio = { version = "1", default-features = false, features = ["rt"] }
zeroize = "1.9"
ctrlc = "3.5"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
overflow-checks = true

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3
