[package]
name = "cortex"
version = "4.0.0"
edition = "2024"
authors = ["Nima Naseri <nerdnull@proton.me>"]
description = "A secure password manager with Argon2id key derivation and authenticated encryption"

[dependencies]
argon2 = "0.5"
arboard = "3"
blake3 = "1.5"
bincode = "1.3"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
fs2 = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
rand = "0.8"
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sled = "0.34"
zeroize = { version = "1.7", features = ["derive"] }
regex = "1.11"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev]
opt-level = 0
debug = true
